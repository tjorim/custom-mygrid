name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'docs/**', 'assets/**', 'LICENSE', 'scripts/**', 'package.json', 'package-lock.json', '.nvmrc', '.github/workflows/pages.yml']
  pull_request:
    branches: [main]
    paths: ['site/**', 'docs/**', 'assets/**', 'LICENSE', 'scripts/**', 'package.json', 'package-lock.json', '.nvmrc', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build Astro site
        run: npm run build
      - name: Check routes, links, anchors and assets
        run: npm test
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
