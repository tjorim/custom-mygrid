version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: build
      include: scope
    groups:
      # astro and its @astrojs packages are pinned together and must move together.
      astro:
        patterns: ["astro", "@astrojs/*"]
